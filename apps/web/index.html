<!doctype html>
<html lang="en" data-theme="paper">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A post-quantum chain of custody for exam papers, on QoreChain testnet." />
    <meta name="color-scheme" content="light dark" />
    <title>Paper Trail</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500&display=swap" />
    <script>
      // Apply the saved or system theme before first paint (not a secret; per-viewer preference).
      (function () {
        var t = null;
        try { t = localStorage.getItem('pt-theme'); } catch (e) {}
        if (t !== 'paper' && t !== 'ink') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'ink' : 'paper';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
